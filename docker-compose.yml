version: '3.8'

services:
  backend-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: scanner-backend
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    volumes:
      - ./agent/dist:C:/MicrosoftScanEngine/agent/dist

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scanner-frontend
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - backend-api